[package]
name = "eztravel-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-lc-rs = "1.18.2"
axum = "0.8.9"
base64 = "0.23.1"
jiff = { version = "0.2.38", features = ["serde", "tzdb-bundle-always"] }
reqwest = { version = "0.13.5", features = ["json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync"] }
toml = "1.1.8"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
