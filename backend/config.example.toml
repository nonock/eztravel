# eztravel backend configuration: an example commute, not anyone's real one.
# Copy it outside the repository and describe your own commute there.

time_zone = "Europe/Paris"

[calendar]
# Any day of a week that uses `first_week`; the weeks then alternate.
anchor = "2026-11-04"
first_week = ["tuesday", "thursday"]
second_week = ["monday", "wednesday", "friday"]
# Whit Monday is a public holiday, but many employers make it a working day.
whit_monday_off = true
# Days off and days changed one by one are set in the app's calendar.

[windows]
# Optional `trains_from`: trains are followed from then, without notifying,
# so that trains cancelled early are known when the window opens.
outbound = { start = "06:45", end = "08:15", trains_from = "05:30" }
inbound = { start = "16:00", end = "17:30" }

# How each line is named in notifications, and its color on the home screen
# (optional, "#RRGGBB": Navitia gives it as the line's `color`).
[[lines]]
code = "C01740"
name = "L"
mode = "train"
color = "#7B61C9"

[[lines]]
code = "C02000"
name = "X"
mode = "metro"
color = "#E07A1F"

# The rides of each way, in order. Stops are Navitia stop areas. `reach`
# (optional) is how many minutes it takes from leaving home, or work, to the
# platform of the ride: the app counts down to when to leave for each train.
# The reminder to leave is for the first ride of the way with a `reach` whose
# station lists its trains one by one (a train line, not the metro): for the
# way's usual train, set in the app, or the one picked there that day.
[[outbound]]
line = "C01740"
board = "stop_area:IDFM:71100"
alight = "stop_area:IDFM:71370"
reach = 12

[[outbound]]
line = "C02000"
board = "stop_area:IDFM:71380"
alight = "stop_area:IDFM:71400"

[[inbound]]
line = "C02000"
board = "stop_area:IDFM:71400"
alight = "stop_area:IDFM:71380"

[[inbound]]
line = "C01740"
board = "stop_area:IDFM:71370"
alight = "stop_area:IDFM:71100"
reach = 25
