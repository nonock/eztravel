# On each push to main: the app's libraries, as Gradle resolves them for a
# release, sent to GitHub's dependency graph. GitHub reads the backend's
# Cargo.lock by itself but not the app's Gradle files, so without this no
# security alert, nor Dependabot security update, covers the app.
# Actions are pinned by commit.
name: Dependency graph

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    permissions:
      # The Dependency Submission API asks for it.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - name: A stand-in Firebase file, the real one stays out of the repository
        run: cp .github/ci-google-services.json android/app/google-services.json
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: android
          # What ships in the app, not the build's own tools nor the tests'.
          dependency-graph-include-configurations: releaseRuntimeClasspath
